# this_file: .github/workflows/site.yml
#
# Rebuild the skills site on every push. On the default branch the fresh
# docs/fl1992mk/ is committed back so GitHub Pages (source: main → /docs)
# publishes it at https://fontlab.dev/vexy-fontlab-writing-skills/fl1992mk/.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py dates the sitemap from the last commit.
          fetch-depth: 1
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Build docs/fl1992mk
        run: ./build.py
      - name: Commit docs/ back to the default branch
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs/ unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Build docs/fl1992mk from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
